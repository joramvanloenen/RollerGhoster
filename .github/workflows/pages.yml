name: Deploy RollerGhoster to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install test-only Three.js and Playwright
        run: npm install --no-save --no-package-lock three@0.164.1 playwright@1.57.0
      - name: Validate physics and generated estate geometry
        run: node --test tests/physics.test.mjs tests/scenery.test.mjs
      - name: Install Chromium for WebGL testing
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python3 -m http.server 8765 > /tmp/rollerghoster-server.log 2>&1 &
          node tests/ride.browser.mjs
      - name: Keep test dependencies out of the published site
        run: rm -rf node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
